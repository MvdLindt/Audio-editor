name: .NET Build (Windows)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    - name: Restore
      run: dotnet restore ./src/AudioEditor/AudioEditor.csproj
    - name: Build
      run: dotnet build ./src/AudioEditor/AudioEditor.csproj -c Release --no-restore
    - name: Run unit tests (none yet)
      run: echo "No tests configured"
