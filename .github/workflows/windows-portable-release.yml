name: Windows Portable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to use for the release (e.g. v1.2.3)'
        required: true
      release_name:
        description: 'Optional release name'
        required: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ./src/AudioEditor/AudioEditor.csproj

      - name: Build
        run: dotnet build ./src/AudioEditor/AudioEditor.csproj -c Release --no-restore

      - name: Publish portable (framework-dependent) win-x64
        run: |
          dotnet publish ./src/AudioEditor/AudioEditor.csproj -c Release -f net8.0-windows -r win-x64 --self-contained false /p:PublishSingleFile=false --output ./artifacts/windows-x64

      - name: Zip portable build
        run: |
          powershell -Command "Compress-Archive -Path .\\artifacts\\windows-x64\\* -DestinationPath .\\artifacts\\AudioEditor-Windows-x64-portable.zip -Force"

      - name: List artifacts
        run: dir .\artifacts

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.release_name || github.event.inputs.tag }}
          generate_release_notes: true
          files: |
            ./artifacts/AudioEditor-Windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
